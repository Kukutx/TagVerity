name: tagverity
description: Privacy-first NFC inspector, tag checker, and batch scanner for Android and iOS.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.13.1 <4.0.0"
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  crypto: 3.0.7
  ndef_record: 1.4.2
  nfc_manager: 4.2.1
  nfc_manager_ndef: 1.1.0
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/tagverity_app_icon.png
    - assets/branding/tagverity_logo.png

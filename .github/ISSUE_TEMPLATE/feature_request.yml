name: Feature request
description: Suggest a user-facing improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What user problem should this solve?
      description: Explain the workflow or pain point before proposing implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what the user should be able to do.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Inspect
        - NDEF
        - Batch
        - History
        - Export / reports
        - Privacy
        - Android
        - iOS
        - Documentation / maintenance
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Project scope
      options:
        - label: This request does not require cloning, UID spoofing, key recovery, relay/replay, or arbitrary APDU tooling.
          required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Optional links or examples are welcome.

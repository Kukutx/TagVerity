name: Bug report
description: Report a reproducible TagVerity problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve TagVerity. Do not paste raw private NFC identifiers, credentials, signing keys, or sensitive card data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Both / not platform-specific
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: "Example: Pixel 9 / Android 16"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: TagVerity version or commit
      placeholder: "Example: 1.0.0 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: tag
    attributes:
      label: NFC tag characteristics
      description: Share only non-sensitive facts such as NFC-A, NDEF, writable/read-only. Redact UID and private content.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Inspect
        2. Start scan
        3. Present tag
        4. ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste redacted TagVerity diagnostics if useful. Review them before posting.
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I removed private NFC identifiers, credentials, signing secrets, and personal data.
          required: true

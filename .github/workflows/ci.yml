name: TagVerity CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: tagverity-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Confirm formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Validate project metadata and schemas
        run: |
          dart run tool/validate_project.dart
          python -m json.tool docs/nfc-scan-export.schema.json > /dev/null
          python -m json.tool docs/diagnostics-export.schema.json > /dev/null
          python -c "import json,pathlib; schema=json.loads(pathlib.Path('docs/nfc-scan-export.schema.json').read_text()); defs=schema[chr(36)+'defs']; assert all(set(defs[name]['required']).issubset(set(defs[name]['properties'])) for name in ('scan','ndefRecord')); assert defs['scan']['properties']['identityStability']['enum'] == ['stable','sessionOnly','unknown']"
      - name: Analyze
        run: flutter analyze
      - name: Test with coverage
        run: flutter test --coverage
      - name: Enforce coverage floor
        run: dart run tool/check_coverage.dart coverage/lcov.info 75
      - name: Compile Android debug APK
        run: flutter build apk --debug
      - name: Compile Android release AAB without signing
        run: flutter build appbundle --release --target-platform android-arm,android-arm64
      - name: Verify Android release ABI contents
        run: |
          python - <<'PY'
          import zipfile

          bundle = 'build/app/outputs/bundle/release/app-release.aab'
          with zipfile.ZipFile(bundle) as archive:
              names = set(archive.namelist())

          required = {
              'base/lib/armeabi-v7a/libapp.so',
              'base/lib/armeabi-v7a/libflutter.so',
              'base/lib/arm64-v8a/libapp.so',
              'base/lib/arm64-v8a/libflutter.so',
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f'Missing required Android runtime entries: {missing}')

          unexpected_x86 = sorted(
              name
              for name in names
              if name.startswith('base/lib/x86')
              and (name.endswith('/libapp.so') or name.endswith('/libflutter.so'))
          )
          if unexpected_x86:
              raise SystemExit(f'Unexpected x86 Flutter runtime entries: {unexpected_x86}')

          print('Android release AAB contains ARM32 + ARM64 Flutter runtimes only.')
          PY
  ios-build:
    needs: analyze-test-build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Compile iOS release app without signing
        run: flutter build ios --release --no-codesign
